<svg xmlns="http://www.w3.org/2000/svg" width="704" height="416" viewBox="0 0 704 416" role="img" aria-labelledby="title desc">
  <title id="title">极坐标与直角坐标的对应关系</title>
  <desc id="desc">第一象限内一点 P 与原点 O 的连线长为 r。这条连线与 x 轴正向的夹角是 θ。两条虚线分别把 P 投影到 x 轴和 y 轴，投影坐标为 r cos θ 和 r sin θ。</desc>
  <rect x="0.5" y="0.5" width="703" height="415" rx="16" fill="#fff" stroke="#d8e2ed"/>
  <path d="M190 330 470 120V330Z" fill="#edf5ff"/>

  <path d="M82 330H608M190 376V50" fill="none" stroke="#475569" stroke-width="1.8"/>
  <path d="M603 325 613 330 603 335Z M185 55 190 45 195 55Z" fill="#475569"/>

  <g fill="none" stroke-width="1.8" stroke-dasharray="6 5">
    <path d="M470 120V330" stroke="#27818a"/>
    <path d="M190 120H470" stroke="#896ba9"/>
  </g>
  <path d="M190 330H470" fill="none" stroke="#13747b" stroke-width="2.8"/>
  <path d="M190 330V120" fill="none" stroke="#745296" stroke-width="2.8"/>
  <path d="M190 330 470 120" fill="none" stroke="#17549a" stroke-width="3.2"/>
  <path d="M257 330A67 67 0 0 0 243.6 289.8" fill="none" stroke="#a35416" stroke-width="2.1"/>
  <path d="M454 330V314H470" fill="none" stroke="#27818a" stroke-width="1.3"/>

  <circle cx="190" cy="330" r="3.6" fill="#29364b"/>
  <circle cx="470" cy="330" r="3.8" fill="#fff" stroke="#13747b" stroke-width="1.8"/>
  <circle cx="190" cy="120" r="3.8" fill="#fff" stroke="#745296" stroke-width="1.8"/>
  <circle cx="470" cy="120" r="5.8" fill="#17549a" stroke="#fff" stroke-width="1.8"/>

  <g font-family="Cambria Math, Cambria, Georgia, serif" font-size="22" fill="#29364b">
    <text x="621" y="337" font-style="italic">x</text>
    <text x="204" y="55" font-style="italic">y</text>
    <text x="177" y="357" text-anchor="end" font-style="italic">O</text>
    <text x="486" y="111" font-style="italic">P(x, y)</text>
    <text x="314" y="216" fill="#17549a" font-style="italic">r</text>
    <text x="267" y="314" fill="#a35416" font-style="italic">θ</text>
    <text x="330" y="364" text-anchor="middle" fill="#09646b">x = r cos θ</text>
    <text x="174" y="231" text-anchor="end" fill="#67438b">y = r sin θ</text>
  </g>
</svg>
